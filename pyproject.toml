[project]
name = "capstone3-sales-forecast"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
extend-exclude = ["common"]
line-length = 140
target-version = "py311"
